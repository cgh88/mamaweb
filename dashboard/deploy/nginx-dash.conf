# dash.mamachicken.kr — 마마치킨 매출 대시보드 (Next.js, 127.0.0.1:3100)
# 설치: sudo cp deploy/nginx-dash.conf /etc/nginx/sites-available/mamadash
#       sudo ln -sf /etc/nginx/sites-available/mamadash /etc/nginx/sites-enabled/mamadash

# Cloudflare 경유 요청만 CF-Connecting-IP를 실제 방문자 IP로 인정 (그 외는 접속한 IP 그대로)
# 출처: https://www.cloudflare.com/ips/

server {
    listen 80;
    server_name dash.mamachicken.kr;

    # Let's Encrypt 인증서 발급·갱신용
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name dash.mamachicken.kr;

    ssl_certificate     /etc/letsencrypt/live/dash.mamachicken.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.mamachicken.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2M;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
